<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BulSU Payroll Portal - Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">⚖️</div>

        <h1>BulSU Payroll Portal</h1>

        <h2 class="auth-heading">
            Forgot Password
        </h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    required
                    autocomplete="email"
                >
            </div>

            <button
                type="submit"
                class="auth-button"
            >
                Send Reset Link
            </button>

        </form>

        <div class="auth-links">
            <a href="{{ url_for('login') }}">
                Back to Sign In
            </a>
        </div>

    </div>

</body>
</html>
