{% extends 'base.html' %}
{% block title %}Forgot Password - BulSU Payroll{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-icon">⚖️</div>
    <h1>Forgot Password</h1>
    <p class="auth-muted">Enter your email to request password recovery instructions.</p>
    <form method="POST">
        <label class="field-label">Email</label><input type="email" name="email" required>
        <button class="btn btn-primary btn-block" type="submit">Send Recovery Email</button>
    </form>
    <p class="auth-bottom"><a href="{{ url_for('login') }}">Back to Login</a></p>
</div>
{% endblock %}
