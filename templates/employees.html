{% extends 'base.html' %}{% block content %}<h1>Employees</h1><div class="card"><form method="post" class="gridform"><label>Employee No<input name="employee_no" required></label><label>Full name<input name="full_name" required></label><label>Type<select name="employee_type">{% for t in ['regular','temporary','contractual','casual','ebjo','cos','part_time'] %}<option>{{t}}</option>{% endfor %}</select></label><label>Department<input name="department"></label><label>Monthly salary<input type="number" step="0.01" name="monthly_salary"></label><label>Hourly rate<input type="number" step="0.01" name="hourly_rate"></label><label>Standard hours<input type="number" step="0.25" name="standard_hours" value="8"></label><label>Workdays/month<input type="number" step="0.5" name="workdays_per_month" value="22"></label><button>Add employee</button></form></div><div class="card tablewrap"><table><tr><th>No.</th><th>Name</th><th>Type</th><th>Department</th><th>Monthly</th><th>Hourly</th></tr>{% for e in employees %}<tr><td>{{e.employee_no}}</td><td>{{e.full_name}}</td><td>{{e.employee_type}}</td><td>{{e.department}}</td><td>{{e.monthly_salary}}</td><td>{{e.hourly_rate}}</td></tr>{% endfor %}</table></div>{% endblock %}
