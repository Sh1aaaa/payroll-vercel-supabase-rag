{% extends 'base.html' %}{% block content %}<h1>Payroll Runs</h1><div class="card"><form method="post" class="gridform"><label>Start date<input type="date" name="start_date" required></label><label>End date<input type="date" name="end_date" required></label><label>Cut-off<select name="cutoff_no"><option value="1">1st</option><option value="2">2nd</option></select></label><button>Generate draft</button></form></div><div class="card"><table><tr><th>Period</th><th>Cut-off</th><th>Status</th><th></th></tr>{% for r in runs %}<tr><td>{{r.start_date}} - {{r.end_date}}</td><td>{{r.cutoff_no}}</td><td>{{r.status}}</td><td><a href="{{url_for('payroll_run',run_id=r.id)}}">View</a></td></tr>{% endfor %}</table></div>{% endblock %}
