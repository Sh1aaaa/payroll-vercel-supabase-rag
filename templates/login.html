
{% extends 'base.html' %}

{% block title %}Login - BulSU Payroll{% endblock %}

{% block content %}

<style>
    .password-field-wrap {
        position: relative;
        width: 100%;
    }

    .password-field-wrap input {
        width: 100%;
        box-sizing: border-box;
        padding-right: 75px;
    }

    .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: #3448a5;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        padding: 6px;
        z-index: 2;
    }

    .password-toggle:hover {
        text-decoration: underline;
    }

    .password-toggle:focus-visible {
        outline: 2px solid #3448a5;
        outline-offset: 2px;
        border-radius: 4px;
    }
</style>

<div class="auth-card">

    <!-- Hidden 3-Click Staff Registration Trigger -->
    <div id="superAdminTrigger"
         class="hidden-admin-trigger"
         title="BulSU Payroll Portal">

        <div class="auth-icon">⚖️</div>

        <h1>BulSU Payroll Portal</h1>

    </div>


    <!-- Login Form -->
    <form method="POST">

        <label class="field-label" for="email">Email</label>

        <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
        >


        <label class="field-label" for="passwordInput">Password</label>

        <!-- Password Input with Show/Hide -->
        <div class="password-field-wrap">

            <input
                type="password"
                id="passwordInput"
                name="password"
                required
                autocomplete="current-password"
            >

            <button
                type="button"
                id="togglePassword"
                class="password-toggle"
                aria-label="Show password"
                aria-controls="passwordInput"
                aria-pressed="false"
            >
                Show
            </button>

        </div>


        <button
            class="btn btn-primary btn-block"
            type="submit">
            Verify Credentials
        </button>

    </form>


    <!-- Forgot Password -->
    <a
        class="auth-link"
        href="{{ url_for('forgot_password') }}">
        Forgot Password?
    </a>


    <!-- Employee Registration -->
    <p class="auth-bottom">
        New employee?
        <a href="{{ url_for('register') }}">
            Register Here
        </a>
    </p>

</div>


<!-- ========================================= -->
<!-- SHOW / HIDE PASSWORD -->
<!-- ========================================= -->

<script>
(function () {

    const passwordInput = document.getElementById("passwordInput");
    const togglePassword = document.getElementById("togglePassword");

    if (!passwordInput || !togglePassword) return;

    togglePassword.addEventListener("click", function () {

        const isHidden = passwordInput.type === "password";

        passwordInput.type = isHidden ? "text" : "password";

        togglePassword.textContent = isHidden ? "Hide" : "Show";

        togglePassword.setAttribute(
            "aria-label",
            isHidden ? "Hide password" : "Show password"
        );

        togglePassword.setAttribute(
            "aria-pressed",
            String(isHidden)
        );

    });

})();
</script>


<!-- ========================================= -->
<!-- HIDDEN 3-CLICK STAFF REGISTRATION -->
<!-- ========================================= -->

<script>
(function () {

    const trigger = document.getElementById("superAdminTrigger");

    if (!trigger) return;

    let clicks = 0;
    let resetTimer = null;


    trigger.addEventListener("click", function () {

        clicks += 1;


        // Clear previous reset timer
        if (resetTimer) {
            clearTimeout(resetTimer);
        }


        // Three clicks
        if (clicks >= 3) {

            clicks = 0;

            // Open staff registration
            window.location.href = "{{ url_for('staff_register') }}";

            return;
        }


        // Reset click counter after 1.2 seconds
        resetTimer = setTimeout(function () {

            clicks = 0;

        }, 1200);

    });

})();
</script>

{% endblock %}
