{% extends 'base.html' %}
{% block title %}Login - BulSU Payroll{% endblock %}

{% block content %}
<div class="auth-card">

    <div id="superAdminTrigger" class="hidden-admin-trigger" title="BulSU Payroll Portal">
        <div class="auth-icon">⚖️</div>
        <h1>BulSU Payroll Portal</h1>
    </div>

    <form method="POST">
        <label class="field-label">Email</label>
        <input type="email" name="email" required>

        <label class="field-label">Password</label>
        <input type="password" name="password" required>

        <button class="btn btn-primary btn-block" type="submit">
            Verify Credentials
        </button>
    </form>

    <a class="auth-link" href="{{ url_for('forgot_password') }}">Forgot Password?</a>

    <p class="auth-bottom">
        New employee?
        <a href="{{ url_for('register') }}">Register Here</a>
    </p>
</div>

<script>
(function () {
    const trigger = document.getElementById("superAdminTrigger");
    if (!trigger) return;

    let clicks = 0;
    let resetTimer = null;

    trigger.addEventListener("click", function () {
        clicks += 1;

        if (resetTimer) {
            clearTimeout(resetTimer);
        }

        if (clicks >= 3) {
            clicks = 0;
            window.location.href = "{{ url_for('setup_super_admin') }}";
            return;
        }

        resetTimer = setTimeout(function () {
            clicks = 0;
        }, 1200);
    });
})();
</script>
{% endblock %}
