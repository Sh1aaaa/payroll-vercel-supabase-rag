{% extends 'base.html' %}
{% block title %}Register - BulSU Payroll{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-icon">⚖️</div>
    <h1>Employee Registration</h1>
    <p class="auth-muted">Your account must be approved by the Super Admin before login.</p>
    <form method="POST">
        <label class="field-label">Full name</label><input type="text" name="full_name" required>
        <label class="field-label">Email</label><input type="email" name="email" required>
        <label class="field-label">Password</label><input type="password" name="password" minlength="6" required>
        <label class="field-label">Confirm password</label><input type="password" name="confirm_password" minlength="6" required>
        <button class="btn btn-primary btn-block" type="submit">Register</button>
    </form>
    <p class="auth-bottom"><a href="{{ url_for('login') }}">Back to Login</a></p>
</div>
{% endblock %}
