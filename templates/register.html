{% extends 'base.html' %}

{% block title %}Register - BulSU Payroll{% endblock %}

{% block content %}

<div class="auth-card">

    <div class="auth-icon">⚖️</div>

    <h1>Employee Registration</h1>

    <p class="auth-muted">
        Your account must be approved by the Super Admin before login.
    </p>


    <form method="POST">

        <!-- FULL NAME -->
        <label class="field-label">
            Full Name
        </label>

        <input
            type="text"
            name="full_name"
            value="{{ request.form.get('full_name', '') }}"
            placeholder="Enter your full name"
            required
        >


        <!-- SCHOOL / EMPLOYEE ID -->
        <label class="field-label">
            School / Employee ID
        </label>

        <input
            type="text"
            name="employee_id"
            value="{{ request.form.get('employee_id', '') }}"
            placeholder="Enter your School / Employee ID"
            required
        >

        <small class="auth-muted">
            Enter your official BulSU School / Employee ID.
        </small>


        <!-- EMPLOYEE TYPE -->
        <label class="field-label">
            Employee Type
        </label>

        <select name="employee_type" required>

            <option value="">
                Select Employee Type
            </option>

            <option
                value="regular"
                {% if request.form.get('employee_type') == 'regular' %}selected{% endif %}
            >
                Regular
            </option>

            <option
                value="temporary"
                {% if request.form.get('employee_type') == 'temporary' %}selected{% endif %}
            >
                Temporary
            </option>

            <option
                value="contractual"
                {% if request.form.get('employee_type') == 'contractual' %}selected{% endif %}
            >
                Contractual
            </option>

            <option
                value="casual"
                {% if request.form.get('employee_type') == 'casual' %}selected{% endif %}
            >
                Casual
            </option>

            <option
                value="ebjo"
                {% if request.form.get('employee_type') == 'ebjo' %}selected{% endif %}
            >
                EBJO
            </option>

            <option
                value="cos"
                {% if request.form.get('employee_type') == 'cos' %}selected{% endif %}
            >
                COS
            </option>

            <option
                value="part_time"
                {% if request.form.get('employee_type') == 'part_time' %}selected{% endif %}
            >
                Part-Time
            </option>

        </select>


        <!-- EMAIL -->
        <label class="field-label">
            Email
        </label>

        <input
            type="email"
            name="email"
            value="{{ request.form.get('email', '') }}"
            placeholder="Enter your email"
            required
        >


        <!-- PASSWORD -->
        <label class="field-label">
            Password
        </label>

        <input
            type="password"
            name="password"
            minlength="6"
            required
        >


        <!-- CONFIRM PASSWORD -->
        <label class="field-label">
            Confirm Password
        </label>

        <input
            type="password"
            name="confirm_password"
            minlength="6"
            required
        >


        <!-- REGISTER -->
        <button
            class="btn btn-primary btn-block"
            type="submit"
        >
            Register
        </button>

    </form>


    <p class="auth-bottom">
        <a href="{{ url_for('login') }}">
            Back to Login
        </a>
    </p>

</div>

{% endblock %}
