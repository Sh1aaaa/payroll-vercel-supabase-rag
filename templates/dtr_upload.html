{% extends 'base.html' %}
{% block title %}Master DTR - BulSU Payroll{% endblock %}
{% block content %}
<div class="role-dashboard">
    <div class="dashboard-heading">
        <h1>Commit Master DTR CSV</h1>
        <p>Super Admin only. These committed records are the attendance source for payroll generation.</p>
    </div>
    <section class="panel">
        <form method="POST" enctype="multipart/form-data">
            <label class="field-label">CSV file</label>
            <input type="file" name="file" accept=".csv" required>
            <div class="hint-box">Expected columns: <code>employee_no, work_date, time_in, time_out</code></div>
            <button class="btn btn-primary" type="submit">Commit Master CSV Data</button>
        </form>
    </section>
</div>
{% endblock %}
